<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>js01</title>
</head>
<body>
    <script type="text/javascript" languague="javascript">
        // declaració de variables
        var nom;
        var cognom;
        
        //valor a las variables
        nom="Alex"
        cognom="Pantoja"

        //sortida de les dades ala consola
        console.log(nom+" "+cognom);

        //sortida de dades (strings)
        document.write("L´alumne es diu "+nom+" "+cognom+"<br>");
        // declarem i donem valor a la vegada
        var nom="John"
        var cognom="McClane"
        document.write("L´alumne es diu "+nom+" "+cognom+"<br>");

        // treballem amb variables numériques (integer)
        var preu=10;
        var iva=1.21;
        document.write("El preu del formatge es "+(preu+iva)+"€<br>");
      
        var cost=preu+iva
        document.write("El preu del formatge es "+cost+"€<br>");
    </script>
</body>
</html>
